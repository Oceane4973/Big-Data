name: Docker Compose Health Check

on: [push, pull_request]

jobs:
  test-infrastructure:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Generate .env from .env-example
      run: |
        cp .env-example .env
        sed -i 's/^MONGO_USER=.*/MONGO_USER=admin/' .env
        sed -i 's/^MONGO_PASSWORD=.*/MONGO_PASSWORD=password/' .env
        sed -i 's/^AIRFLOW_ADMIN_USERNAME=.*/AIRFLOW_ADMIN_USERNAME=admin/' .env
        sed -i 's/^AIRFLOW_ADMIN_PASSWORD=.*/AIRFLOW_ADMIN_PASSWORD=password/' .env
        sed -i 's/^AIRFLOW_ADMIN_EMAIL=.*/AIRFLOW_ADMIN_EMAIL=admin@email.com/' .env
        sed -i 's/^AIRFLOW_POSTGRES_USER=.*/AIRFLOW_POSTGRES_USER=user/' .env
        sed -i 's/^AIRFLOW_POSTGRES_PASSWORD=.*/AIRFLOW_POSTGRES_PASSWORD=password/' .env
        sed -i 's/^POSTGRES_USER=.*/POSTGRES_USER=user/' .env
        sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=password/' .env
        cat .env
    
    - name: Start Docker Compose
      run: docker compose up --build -d
    
    - name: Wait for healthy services
      run: |
        echo "Waiting for health checks (max 120s)..."
        for i in {1..24}; do
          postgres-airflow_status=$(docker inspect postgres_airflow --format='{{.State.Health.Status}}' 2>/dev/null || echo "unhealthy")
          airflow-init_status=$(docker inspect airflow-init --format='{{.State.Health.Status}}' 2>/dev/null || echo "unhealthy")
          airflow-webserver_status=$(docker inspect airflow-webserver --format='{{.State.Health.Status}}' 2>/dev/null || echo "unhealthy")
          mongo_status=$(docker inspect mongodb --format='{{.State.Health.Status}}' 2>/dev/null || echo "unhealthy")
          postgres_status=$(docker inspect postgres --format='{{.State.Health.Status}}' 2>/dev/null || echo "unhealthy")
          
          echo "[$i/24]"
          echo "Postgres Airflow: $postgres-airflow_status"
          echo "Airflow init: $airflow-init_status"
          echo "Airflow webserver: $airflow-webserver_status"
          echo "Mongo: $mongo_status"
          echo "Postgres: $postgres_status"

          if [ "$postgres-airflow_status" = "healthy" ] && [ "$airflow-init_status" = "healthy" ] 
            && [ "$airflow-webserver_status" = "healthy" ] && [ "$mongo_status" = "healthy" ] 
            && [ "$mongo_status" = "healthy" ]; then

            echo "[SUCCESS] ALL SERVICES HEALTHY!"
            exit 0
          fi
          sleep 5
        done
        echo "[ERROR] TIMEOUT - Services not healthy"
        docker ps -a
        exit 1
    
    - name: Run tests
      run: echo "[INFO] Infrastructure ready for tests!"
    
    - name: Cleanup
      if: always()
      run: docker compose down -v
