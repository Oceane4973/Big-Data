apiVersion: 1

datasources:
  - name: sncf_organized_data
    type: postgres
    access: proxy
    url: ${POSTGRES_CONTAINER_NAME}:${POSTGRES_CONTAINER_PORT}
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    isDefault: true
    jsonData:
      sslmode: "disable"
